name: CI — Frontend (React)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint e Build do Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        # v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Node.js 22
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar qualidade do código (ESLint)
        run: npm run lint

      - name: Executar testes de regressão
        run: npm test

      - name: Build de produção (TypeScript + Vite)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_SENTRY_ENVIRONMENT: ci
